on>\u003coption>Deep-Plane Facelift\u003c/option>\u003coption>Mini Facelift\u003c/option>\u003coption>Neck Lift\u003c/option>\u003coption>Midface Lift\u003c/option>\u003coption>Eyelid Surgery\u003c/option>\u003coption>Brow Lift\u003c/option>\u003coption>Rhinoplasty\u003c/option>\u003coption>Facial Implants\u003c/option>\u003coption>Skin &amp; Laser\u003c/option>\u003coption>Liposuction\u003c/option>\u003c/select>\n        \u003c/label>\n        \u003clabel class=\"f\">Preferred Contact Method\n          \u003cselect name=\"method\" required>\u003coption value=\"\">Select an option\u003c/option>\u003coption>Phone call\u003c/option>\u003coption>Text message\u003c/option>\u003coption>Email\u003c/option>\u003c/select>\n        \u003c/label>\n        \u003clabel class=\"f f--full\">Are you traveling from outside the Coachella Valley?\n          \u003cselect name=\"travel\">\u003coption value=\"\">Select an option\u003c/option>\u003coption>Yes\u003c/option>\u003coption>No\u003c/option>\u003c/select>\n        \u003c/label>\n        \u003clabel class=\"f f--full\">Message (optional)\u003ctextarea name=\"message\" rows=\"2\" placeholder=\"Tell us about your situation...\">\u003c/textarea>\u003c/label>\n      \u003c/div>\n      \u003cp class=\"form-note\">Please do not include medical history or personal health information in this form.\u003c/p>\n      \u003clabel class=\"check\">\u003cinput type=\"checkbox\" name=\"consent\" required> \u003cspan>I agree to be contacted by phone, text message, or email about my inquiry. Message and data rates may apply. Reply STOP to opt out.\u003c/span>\u003c/label>\n      \u003cbutton type=\"submit\" class=\"btn btn-navy btn-block btn-lg\">Request My Consultation \u003cspan class=\"arr\">\u2192\u003c/span>\u003c/button>\n      \u003cp class=\"form-status\" role=\"status\" aria-live=\"polite\">\u003c/p>\n    \u003c/form>\n  \u003c/div>\n\u003c/section>\n\n\u003c/main>\n\n\u003cfooter class=\"site-footer\">\n  \u003cdiv class=\"container footer-grid\">\n    \u003cdiv>\n      \u003cp class=\"brand-name brand-name--dark\">Bruce B. Chisholm, M.D.\u003c/p>\n      \u003cp class=\"brand-tag brand-tag--dark\">The Facelift Specialist\u003c/p>\n      \u003cp class=\"footer-about\">Natural, customized facelift and facial rejuvenation surgery in Rancho Mirage, California.\u003c/p>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch4>Visit Us\u003c/h4>\n      \u003caddress>Eisenhower Medical Center, Warke Health Center\u003cbr>39300 Bob Hope Drive, Suite 1208\u003cbr>Rancho Mirage, CA 92270\u003c/address>\n      \u003ca href=\"tel:7608322923\" class=\"footer-phone\">760-832-2923\u003c/a>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch4>Explore\u003c/h4>\n      \u003cul>\u003cli>\u003ca href=\"#facelift\" data-view=\"home\" data-anchor=\"facelift\">Facelift Surgery\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#facelift\" data-view=\"home\" data-anchor=\"facelift\">Deep-Plane Facelift\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#results\" data-view=\"home\" data-anchor=\"results\">Before &amp; After\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#\">Out-of-Town Patients\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#contact\">Schedule a Consultation\u003c/a>\u003c/li>\u003c/ul>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch4>Office Hours\u003c/h4>\n      \u003cdl class=\"hours\">\n        \u003cdiv>\u003cdt>Monday \u2013 Thursday\u003c/dt>\u003cdd>9:00 AM \u2013 5:00 PM\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>Friday\u003c/dt>\u003cdd>9:00 AM \u2013 3:00 PM\u003c/dd>\u003c/div>\n        \u003cdiv>\u003cdt>Saturday \u2013 Sunday\u003c/dt>\u003cdd>Closed\u003c/dd>\u003c/div>\n      \u003c/dl>\n      \u003ca href=\"#\" class=\"insta\">Follow Dr. Chisholm on Instagram \u003cspan class=\"arr\" aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"container footer-bottom\">\n    \u003cdiv>\n      \u003cp>\u00a9 \u003cspan data-year>2026\u003c/span> Bruce B. Chisholm, M.D. All rights reserved.\u003c/p>\n      \u003cp>The information on this website is for educational purposes only and is not a substitute for a medical consultation. Individual results vary.\u003c/p>\n    \u003c/div>\n    \u003cnav aria-label=\"Legal\">\u003ca href=\"#\">Privacy Policy\u003c/a>\u003ca href=\"#\">Notice of Privacy Practices\u003c/a>\u003ca href=\"#\">Terms &amp; Medical Disclaimer\u003c/a>\u003ca href=\"#\">Accessibility\u003c/a>\u003c/nav>\n  \u003c/div>\n\u003c/footer>\n\n\u003cscript>\n/* ==========================================================================\n   Interacciones comunes (id\u00e9nticas en todos los demos)\n   - Men\u00fa m\u00f3vil (.nav-toggle \u2192 body.nav-open) y header con sombra al hacer scroll\n   - Sliders antes/despu\u00e9s (.ba + input range invisible \u2192 variable CSS --pos)\n   - Tabs accesibles ([data-tabs] con role=\"tab\"/\"tabpanel\", flechas del teclado)\n   - Acordeones (\u003cdetails> nativo: no requiere JS)\n   - Formularios (form[novalidate]): validaci\u00f3n visual, sin env\u00edo real\n   - A\u00f1o autom\u00e1tico en [data-year]\n   ========================================================================== */\nconst $ = (s, c = document) => c.querySelector(s);\nconst $$ = (s, c = document) => Array.from(c.querySelectorAll(s));\n\n(function core() {\n  'use strict';\n\n  /* Men\u00fa m\u00f3vil + header ---------------------------------------------------- */\n  const toggle = $('.nav-toggle');\n  const header = $('.site-header');\n  const setNav = (open) => {\n    document.body.classList.toggle('nav-open', open);\n    if (toggle) {\n      toggle.setAttribute('aria-expanded', String(open));\n      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');\n    }\n  };\n  toggle && toggle.addEventListener('click', () => setNav(!document.body.classList.contains('nav-open')));\n  $$('#main-nav a').forEach((a) => a.addEventListener('click', () => setNav(false)));\n  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setNav(false); });\n  if (header) {\n    const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 10);\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n  }\n\n  /* Sliders antes/despu\u00e9s ---------------------------------------------------\n     El \u003cinput type=\"range\"> cubre la imagen: rat\u00f3n, t\u00e1ctil y teclado.       */\n  $$('.ba').forEach((ba) => {\n    const range = $('.ba-range', ba);\n    if (!range) return;\n    const update = () => ba.style.setProperty('--pos', range.value + '%');\n    range.addEventListener('input', update);\n    update();\n  });\n\n  /* Tabs ------------------------------------------------------------------- */\n  $$('[data-tabs]').forEach((group) => {\n    const tabs = $$('[role=\"tab\"]', group);\n    const activate = (tab, focus) => {\n      tabs.forEach((t) => {\n        const on = t === tab;\n        t.classList.toggle('is-active', on);\n        t.setAttribute('aria-selected', String(on));\n        t.tabIndex = on ? 0 : -1;\n        const panel = document.getElementById(t.getAttribute('aria-controls'));\n        if (panel) panel.hidden = !on;\n      });\n      if (focus) tab.focus();\n      group.dispatchEvent(new CustomEvent('tabchange', { detail: { index: tabs.indexOf(tab), tab } }));\n    };\n    tabs.forEach((tab, i) => {\n      tab.addEventListener('click', () => activate(tab));\n      tab.addEventListener('keydown', (e) => {\n        const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];\n        if (!dir) return;\n        e.preventDefault();\n        activate(tabs[(i + dir + tabs.length) % tabs.length], true);\n      });\n    });\n  });\n\n  /* Formularios ------------------------------------------------------------ */\n  $$('form[novalidate]').forEach((form) => {\n    const status = $('.form-status', form);\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      let firstBad = null;\n      $$('[required]', form).forEach((field) => {\n        const valid = field.type === 'checkbox' ? field.checked : field.checkValidity() && field.value.trim() !== '';\n        const target = field.type === 'checkbox' ? field.closest('.check') : field;\n        target.classList.toggle('is-invalid', !valid);\n        if (!valid && !firstBad) firstBad = field;\n      });\n      if (firstBad) {\n        if (status) { status.textContent = 'Please complete the highlighted fields.'; status.className = 'form-status err'; }\n        firstBad.focus();\n        return;\n      }\n      // TODO: conectar con el endpoint / CRM real (fetch) antes de producci\u00f3n.\n      if (status) { status.textContent = 'Thank you. Our team will contact you within one business day.'; status.className = 'form-status ok'; }\n      form.reset();\n    });\n    form.addEventListener('input', (e) => e.target.classList && e.target.classList.remove('is-invalid'));\n    form.addEventListener('change', (e) => { const c = e.target.closest('.check'); c && c.classList.remove('is-invalid'); });\n  });\n\n  /* A\u00f1o -------------------------------------------------------------------- */\n  $$('[data-year]').forEach((el) => { el.textContent = new Date().getFullYear(); });\n})();\n\n/* ==========================================================================\n   Demo 06 \u2014 espec\u00edfico\n   - Acorde\u00f3n \"His Philosophy\": solo un elemento abierto a la vez\n   - Publicaciones: la tarjeta muestra el a\u00f1o y t\u00edtulo de la publicaci\u00f3n activa\n   ========================================================================== */\n(function demo06() {\n  'use strict';\n  $$('[data-accordion-single]').forEach((acc) => {\n    const items = $$('details', acc);\n    items.forEach((d) => d.addEventListener('toggle', () => {\n      if (d.open) items.forEach((o) => { if (o !== d) o.open = false; });\n    }));\n  });\n\n  const list = $('#pub-list');\n  const card = $('.pub-feature');\n  if (list && card) {\n    list.addEventListener('click', (e) => {\n      const btn = e.target.closest('button[data-pub-year]');\n      if (!btn) return;\n      $$('button', list).forEach((b) => b.classList.toggle('is-active', b === btn));\n      $('#pub-year').textContent = btn.dataset.pubYear;\n      $('#pub-title').textContent = $('span', btn).textContent;\n      card.classList.remove('is-swapping'); void card.offsetWidth; card.classList.add('is-swapping');\n    });\n  }\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script>
(function(){
  var frame=document.getElementById('v'), cache={}, current=null;
  function page(view){
    if(!cache[view]){
      var t=JSON.parse(document.getElementById('p-'+view).textContent);
      t=t.replace(/<head([^>]*)>/i,'<head$1><base target="_top">');
      cache[view]=t;
    }
    return cache[view];
  }
  function viewFromHash(){ return location.hash==='#about' ? 'about' : 'home'; }
  var pending=null;
  function render(anchor){
    var view=viewFromHash();
    if(view===current){ if(anchor) scrollTo(anchor); return; }
    current=view; pending=anchor||null;
    frame.srcdoc=page(view);
  }
  function scrollTo(id){
    try{
      var d=frame.contentDocument, el=id?d.getElementById(id):null;
      if(el) el.scrollIntoView({behavior:'smooth'});
      else frame.contentWindow.scrollTo({top:0,behavior:'smooth'});
    }catch(e){}
  }
  function go(view,anchor){
    if(view==='about'){ if(location.hash!=='#about') history.pushState(null,'','#about'); }
    else if(location.hash==='#about'){ history.pushState(null,'',location.pathname+location.search); }
    render(anchor);
  }
  frame.addEventListener('load',function(){
    try{
      var d=frame.contentDocument;
      if(d.title) document.title=d.title;
      d.addEventListener('click',function(e){
        var a=e.target.closest && e.target.closest('a[data-view]');
        if(!a) return;
        e.preventDefault(); e.stopPropagation();
        go(a.getAttribute('data-view'), a.getAttribute('data-anchor'));
      },true);
      d.addEventListener('click',function(e){
        if(e.defaultPrevented) return;
        var a=e.target.closest && e.target.closest('a[href^="#"]');
        if(!a) return;
        e.preventDefault();
        scrollTo(a.getAttribute('href').slice(1));
      });
      if(pending){ var id=pending; pending=null; setTimeout(function(){ var el=d.getElementById(id); if(el) el.scrollIntoView(); },300); }
    }catch(err){}
  });
  window.addEventListener('popstate',function(){ render(); });
  render();
})();
</script>
</body></html>
